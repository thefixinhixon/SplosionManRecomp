# Linux AppImage build, portable: built inside almalinux:9 so the AppImage
# needs only glibc 2.34 and the system's GCC 11 libstdc++ (Ubuntu 22.04+,
# Debian 12+, Fedora 35+, RHEL 9 family, Steam Deck, Arch). The newer C++
# library pieces the SDK needs come from gcc-toolset-13 and are linked into
# each binary. The same scripts run locally with
# packaging/linux/container-build.sh.

name: Linux build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the AppImage file name (e.g. v2.3); empty = git describe"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  appimage:
    name: AppImage (x86_64, glibc 2.34)
    runs-on: ubuntu-latest
    container:
      image: almalinux:9
      # The AppImage tools are run extracted; no FUSE needed.
    steps:
      - name: Install git
        run: dnf -y install git ca-certificates

      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (clang, gcc-toolset-13, CMake, Qt 6.8)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/linux/deps-almalinux9.sh

      - name: Build game, runtime and launcher; package the AppImage
        env:
          WORK: ${{ runner.temp }}/ci
          VERSION: ${{ inputs.version }}
        run: |
          [ -n "$VERSION" ] || unset VERSION
          packaging/linux/build-release.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: splosionman-linux-appimage
          path: ${{ runner.temp }}/ci/*.AppImage
          if-no-files-found: error
