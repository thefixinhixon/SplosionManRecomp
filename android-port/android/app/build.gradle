plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tp.splosionman'
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId 'com.tp.splosionman'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.3-android-test3'

        ndk {
            // Modern Android devices are arm64-v8a.
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                // RelWithDebInfo for every variant: the recompiled guest code
                // and the runtime are far too slow at -O0 (the AGP default
                // for debug), and this keeps the APK debuggable for log
                // pulls while running optimized native code.
                arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.30.3'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // SDL3's Java activity classes are compiled straight from the SDK tree
    // vendored in this repo (same SDL revision as the native build).
    sourceSets {
        main {
            java.srcDirs = ['src/main/java',
                            rootProject.file('../sdk/thirdparty/sdl3/android-project/app/src/main/java')]
        }
    }

    packaging {
        jniLibs {
            // Extract .so files to real files on disk: the ReXGlue runtime
            // dlopen()s its GPU plugin by filesystem path.
            useLegacyPackaging true
        }
    }
}
